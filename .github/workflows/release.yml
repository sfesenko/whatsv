name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0) — must exist'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Require a tag for manual releases
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "workflow_dispatch requires the 'tag' input" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag must look like vX.Y.Z" >&2; exit 1 ;;
          esac
          git rev-parse "refs/tags/$TAG" >/dev/null
          version=$(sed -n "s/^[[:space:]]*version:[[:space:]]*'\([^']*\)'.*/\1/p" meson.build | head -n1)
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match meson version v$version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build valac \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libglib2.0-dev gettext \
            desktop-file-utils appstream

      - name: Setup
        run: meson setup build --prefix=/usr

      - name: Compile
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs --verbose

      - name: Dist
        run: meson dist -C build --no-tests --formats gztar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: build/meson-dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
