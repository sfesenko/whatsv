name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0) — must exist'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build valac \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libglib2.0-dev gettext \
            desktop-file-utils appstream

      - name: Setup
        run: meson setup build --prefix=/usr

      - name: Compile
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs --verbose

      - name: Dist
        run: meson dist -C build --no-tests --formats gztar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: build/meson-dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
