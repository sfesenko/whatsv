# Shared last segment with alt-site.conf: the distinct exec_name prevents a
# /usr/bin collision. Exercises non-default cookie persistence.
app_id=com.example.shared-ephemeral
app_name=Ephemeral Client
exec_name=ephemeralclient
start_url=https://example.com/
host=example.com
icon=tests/fixtures/test-icon.svg
icon_symbolic=tests/fixtures/test-icon-symbolic.svg
persist_cookies=false
ephemeral=false
