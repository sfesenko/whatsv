# Rich valid fixture: multiple hosts, subdomain coverage, data/cache roots and
# cookie persistence enabled. Shares the last app_id segment with
# ephemeral-site.conf, so distinct exec_name values keep installs disjoint.
app_id=com.example.shared-alt
app_name=Alt Client
exec_name=altclient
start_url=https://example.com/
host=example.com
host=.api.example.com
icon=tests/fixtures/test-icon.svg
icon_symbolic=tests/fixtures/test-icon-symbolic.svg
persist_cookies=true
data_dir=/tmp/webapp-alt-data
cache_dir=/tmp/webapp-alt-cache
